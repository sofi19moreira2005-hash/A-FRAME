<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Extras: Tube - A-Frame</title>
  <meta name="description" content="Tube following a custom path, primitive and component.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-extras.tube.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Extras: Tube</b><br>Tube following a custom path, primitive and component.<br><small></small></div>
  <a-scene >

    <a-tube path="-3 1 -4, -1 3 -5, 1 1 -5, 3 3 -4" radius="0.2" segments="64" material="color: #ec407a"></a-tube>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
