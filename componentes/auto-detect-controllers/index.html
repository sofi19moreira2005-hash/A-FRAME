<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto Detect Controllers - A-Frame</title>
  <meta name="description" content="Auto-Detect Controllers component for A-Frame.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-auto-detect-controllers-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Auto Detect Controllers</b><br>Auto-Detect Controllers component for A-Frame.<br><small>Deteta automaticamente o comando VR ligado (Vive, Oculus, Daydream, GearVR...). Entra em modo VR com um comando.</small></div>
  <a-scene >

    <a-entity auto-detect-controllers="hand: right"></a-entity>
    <a-entity auto-detect-controllers="hand: left"></a-entity>
    <a-box position="0 1 -3" color="#26a69a"></a-box>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
