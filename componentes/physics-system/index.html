<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Physics System - A-Frame</title>
  <meta name="description" content="Physics system for A-Frame VR, built on Cannon.js">
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="aframe-physics-system.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Physics System</b><br>Physics system for A-Frame VR, built on Cannon.js<br><small>Corpos dinâmicos a cair sob gravidade (Cannon.js).</small></div>
  <a-scene >

    <a-plane static-body rotation="-90 0 0" width="20" height="20" color="#7BC8A4"></a-plane>
    <a-box dynamic-body position="0 5 -4" color="#e53935"></a-box>
    <a-box dynamic-body position="0.3 7 -4" rotation="0 30 0" color="#fb8c00"></a-box>
    <a-sphere dynamic-body position="-0.5 9 -4" radius="0.6" color="#1e88e5"></a-sphere>
    <a-sphere dynamic-body position="0.8 11 -4" radius="0.5" color="#8e24aa"></a-sphere>
    <a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 2 2"></a-entity>
  </a-scene>
</body>
</html>
