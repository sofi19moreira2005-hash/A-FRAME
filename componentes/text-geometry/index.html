<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Text Geometry - A-Frame</title>
  <meta name="description" content="Geometry-based text for A-Frame">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="aframe-text-geometry-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Text Geometry</b><br>Geometry-based text for A-Frame<br><small></small></div>
  <a-scene >

    <a-entity text-geometry="value: A-Frame; font: https://unpkg.com/three@0.147.0/examples/fonts/helvetiker_regular.typeface.json; size: 0.5; height: 0.1" material="color: #ff5722" position="-1.4 1.8 -4"></a-entity>
    <a-entity text-geometry="value: 3D Text; font: https://unpkg.com/three@0.147.0/examples/fonts/helvetiker_bold.typeface.json; size: 0.35; height: 0.05" material="color: #2196f3" position="-0.9 1 -4"></a-entity>
    <a-light type="directional" position="1 3 2"></a-light><a-light type="ambient" intensity="0.6"></a-light>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
