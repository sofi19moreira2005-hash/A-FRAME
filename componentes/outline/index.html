<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Outline - A-Frame</title>
  <meta name="description" content="Two-pass Outline effect component for A-Frame">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="aframe-outline.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Outline</b><br>Two-pass Outline effect component for A-Frame<br><small></small></div>
  <a-scene renderer="colorManagement: false" outline>

    <a-assets></a-assets>
    <a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
    <a-box position="-1.2 1 -3" color="#fff" outline></a-box>
    <a-sphere position="1.2 1 -3" color="#ffcc80" outline></a-sphere>
    <a-light type="directional" position="1 3 2"></a-light><a-light type="ambient" intensity="0.6"></a-light>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky>
  </a-scene>
</body>
</html>
