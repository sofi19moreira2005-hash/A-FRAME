<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shake2show - A-Frame</title>
  <meta name="description" content="Using shake.js to display toggle UI modal">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-shake2show-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Shake2show</b><br>Using shake.js to display toggle UI modal<br><small>Abre um modal UI quando o dispositivo móvel é abanado.</small></div>
  <a-scene >

    <a-entity shake2show="" position="0 1.6 -2"></a-entity>
    <a-box position="0 1 -3" color="#26a69a"></a-box>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
