<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Extras: Ocean - A-Frame</title>
  <meta name="description" content="Flat-shaded, animated ocean primitive and component.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-extras.ocean.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Extras: Ocean</b><br>Flat-shaded, animated ocean primitive and component.<br><small></small></div>
  <a-scene >

    <a-ocean width="40" depth="40" density="40" speed="1.2" amplitude="0.5" amplitude-variance="0.4" color="#1e88e5" opacity="0.85"></a-ocean>
    <a-box position="0 1 -4" color="#ffee58"></a-box>
    <a-sky color="#b3e5fc"></a-sky><a-entity camera look-controls wasd-controls position="0 2 3"></a-entity>
  </a-scene>
</body>
</html>
