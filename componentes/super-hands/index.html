<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Super Hands - A-Frame</title>
  <meta name="description" content="All-in-one natural hand controller interaction component for A-Frame.">
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="aframe-event-set-component.min.js"></script>
  <script src="super-hands.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Super Hands</b><br>All-in-one natural hand controller interaction component for A-Frame.<br><small>Interação "agarrar" com rato (arrastar). Também funciona com comandos VR.</small></div>
  <a-scene >

    <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable" super-hands="colliderEvent: raycaster-intersection; colliderEventProperty: els; colliderEndEvent: raycaster-intersection-cleared; colliderEndEventProperty: clearedEls"></a-entity>
    <a-box class="clickable" hoverable grabbable draggable position="-1.5 1.2 -3" color="#e53935" event-set__hover="_event: hover-start; color: #fff176" event-set__unhover="_event: hover-end; color: #e53935"></a-box>
    <a-sphere class="clickable" hoverable grabbable draggable position="1.5 1.2 -3" radius="0.5" color="#1e88e5"></a-sphere>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
