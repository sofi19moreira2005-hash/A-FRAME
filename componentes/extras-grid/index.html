<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Extras: Grid - A-Frame</title>
  <meta name="description" content="Square grid primitive for scene debugging.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-extras.grid.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Extras: Grid</b><br>Square grid primitive for scene debugging.<br><small></small></div>
  <a-scene >

    <a-grid position="0 0 0" width="20" height="20"></a-grid>
    <a-box position="0 0.5 -3" color="#ff7043"></a-box>
    <a-sky color="#263238"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
