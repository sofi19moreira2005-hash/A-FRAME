<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Crawling Cursor - A-Frame</title>
  <meta name="description" content="A A-Frame component to move cursor along objects' surface.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-crawling-cursor.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Crawling Cursor</b><br>A A-Frame component to move cursor along objects' surface.<br><small>Passa o rato sobre os objetos: o cursor rasteja pela superfície.</small></div>
  <a-scene >

    <a-entity cursor="rayOrigin: mouse" raycaster="objects: .target"></a-entity>
    <a-sphere class="target" position="0 1.5 -4" radius="1.5" color="#8d6e63"></a-sphere>
    <a-box class="target" position="-3 1 -4" color="#5c6bc0"></a-box>
    <a-entity crawling-cursor="target: .target" geometry="primitive: ring; radiusInner: 0.04; radiusOuter: 0.08" material="color: #ffeb3b; shader: flat; side: double"></a-entity>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
