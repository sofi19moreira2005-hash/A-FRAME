<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Event Set - A-Frame</title>
  <meta name="description" content="Component to set properties in response to events.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-event-set-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Event Set</b><br>Component to set properties in response to events.<br><small>Aponta o cursor (mira) para os objetos e vê as propriedades a mudar.</small></div>
  <a-scene >

    <a-box position="-1.5 1 -3" color="#2196f3" event-set__enter="_event: mouseenter; color: #ff5722; scale: 1.3 1.3 1.3" event-set__leave="_event: mouseleave; color: #2196f3; scale: 1 1 1" event-set__click="_event: click; material.color: #4caf50"></a-box>
    <a-sphere position="1.5 1 -3" color="#9c27b0" event-set__enter="_event: mouseenter; radius: 0.8" event-set__leave="_event: mouseleave; radius: 0.5" radius="0.5"></a-sphere>
    <a-entity camera look-controls position="0 1.6 0"><a-cursor></a-cursor></a-entity>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky>
  </a-scene>
</body>
</html>
