<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Particle System - A-Frame</title>
  <meta name="description" content="Particle systems for A-Frame.">
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="aframe-particle-system-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Particle System</b><br>Particle systems for A-Frame.<br><small></small></div>
  <a-scene >

    <a-entity particle-system="preset: snow; particleCount: 3000; positionSpread: 10 10 10" position="0 4 -4"></a-entity>
    <a-entity particle-system="preset: dust; color: #ff0000,#ffff00" position="-4 1 -4"></a-entity>
    <a-box position="0 0.5 -3" color="#795548"></a-box>
    <a-sky color="#1a237e"></a-sky><a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
