<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Raytrace - A-Frame</title>
  <meta name="description" content="An A-Frame component for placing raytraced surfaces in a scene.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-raytrace-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Raytrace</b><br>An A-Frame component for placing raytraced surfaces in a scene.<br><small>Superfície desenhada por um fragment shader (raytracing).</small></div>
  <a-scene >

    <script id="rt-fs" type="x-shader/x-fragment">
      uniform float time;
      uniform vec3 localCameraPos;
      varying vec3 localSurfacePos;
      void main(){
        vec3 dir = normalize(localSurfacePos - localCameraPos);
        float s = 0.5 + 0.5*sin(time*0.002 + dir.x*10.0 + dir.y*10.0);
        gl_FragColor = vec4(s, 0.3, 1.0 - s, 1.0);
      }
    </script>
    <a-box position="0 1.6 -3" raytrace="shader: #rt-fs"></a-box>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
