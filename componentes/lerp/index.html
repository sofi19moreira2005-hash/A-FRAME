<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lerp - A-Frame</title>
  <meta name="description" content="A Linear Interpolation component for A-Frame.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-lerp-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Lerp</b><br>A Linear Interpolation component for A-Frame.<br><small>A caixa muda de posição a cada 1.5s e desliza suavemente (lerp) até lá.</small></div>
  <a-scene >

    <a-box id="b" position="0 1 -4" color="#e91e63" lerp="properties: position"></a-box>
    <script>
      var b=document.getElementById('b'),t=0;
      setInterval(function(){t++;        b.setAttribute('position',{x:(Math.random()-0.5)*6,y:0.5+Math.random()*3,z:-3-Math.random()*3});},1500);
    </script>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
