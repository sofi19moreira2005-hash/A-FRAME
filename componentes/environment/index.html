<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Environment - A-Frame</title>
  <meta name="description" content="Infinite environments for your A-Frame VR scene in just one file.">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="aframe-environment-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Environment</b><br>Infinite environments for your A-Frame VR scene in just one file.<br><small>Presets: default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris.</small></div>
  <a-scene >

    <a-entity environment="preset: forest; dressing: trees; dressingAmount: 80; lighting: distant; grid: 1x1"></a-entity>
    <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
  </a-scene>
</body>
</html>
