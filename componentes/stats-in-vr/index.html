<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stats In VR - A-Frame</title>
  <meta name="description" content="stats-in-vr component for A-Frame.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-stats-in-vr-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Stats In VR</b><br>stats-in-vr component for A-Frame.<br><small>Mostra as estatísticas de desempenho dentro de VR (painel junto à câmara).</small></div>
  <a-scene stats stats-in-vr>

    <a-box position="0 1 -4" color="#ffb300" animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true"></a-box>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
