<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Room - A-Frame</title>
  <meta name="description" content="An A-Frame component for quickly creating rooms connected by doors.">
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="aframe-room-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Room</b><br>An A-Frame component for quickly creating rooms connected by doors.<br><small>Duas salas ligadas por uma porta (doorlink).</small></div>
  <a-scene >

    <rw-room position="-2 0 -2" material="color:#866">
      <rw-wall position="4 0 0"></rw-wall>
      <rw-wall position="4 0 4"></rw-wall>
      <rw-wall position="0 0 4"></rw-wall>
      <rw-wall position="0 0 0">
        <rw-doorhole id="holeA"></rw-doorhole>
        <rw-doorlink from="#holeA" to="#holeB" position="2.5 0 0"></rw-doorlink>
      </rw-wall>
    </rw-room>
    <rw-room position="0 0 -5">
      <rw-wall position=" 1 0 -1" material="color:#787"></rw-wall>
      <rw-wall position=" 1 0  1" material="color:#877">
        <rw-doorhole id="holeB"></rw-doorhole>
      </rw-wall>
      <rw-wall position="-1 0  1" material="color:#878"></rw-wall>
      <rw-wall position="-1 0 -1" material="color:#778"></rw-wall>
    </rw-room>
    <a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 1"></a-entity>
  </a-scene>
</body>
</html>
