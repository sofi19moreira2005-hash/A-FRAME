<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Animation - A-Frame</title>
  <meta name="description" content="Animations in A-Frame using anime.js">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-animation-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Animation</b><br>Animations in A-Frame using anime.js<br><small></small></div>
  <a-scene >

    <a-box position="-2 1 -4" color="#e53935" animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true"></a-box>
    <a-sphere position="0 1 -4" radius="0.6" color="#fdd835" animation="property: position; dir: alternate; dur: 1500; easing: easeInOutQuad; loop: true; to: 0 3 -4"></a-sphere>
    <a-cone position="2 1 -4" color="#43a047" animation="property: scale; dir: alternate; dur: 1000; loop: true; to: 1.8 1.8 1.8"></a-cone>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
