<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Metronome - A-Frame</title>
  <meta name="description" content="A simple component that fires events at specified intervals. Useful for musical looping applications.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-metronome-component.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Metronome</b><br>A simple component that fires events at specified intervals. Useful for musical looping applications.<br><small>Emite o evento metronome-tick a 100 BPM.</small></div>
  <a-scene >

    <a-entity metronome="bpm: 100" id="m"></a-entity>
    <a-sphere id="ball" position="0 1.5 -4" radius="0.5" color="#ff5252"></a-sphere>
    <script>
      var on=false,ball=document.getElementById('ball');
      document.getElementById('m').addEventListener('metronome-tick',function(){on=!on;ball.setAttribute('color',on?'#ffeb3b':'#ff5252');ball.setAttribute('scale',on?'1.4 1.4 1.4':'1 1 1');});
    </script>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
