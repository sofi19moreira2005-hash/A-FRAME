<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Extras: Json Model - A-Frame</title>
  <meta name="description" content="Loader for THREE.JSONLoader-compatible models.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-extras.json-model.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Extras: Json Model</b><br>Loader for THREE.JSONLoader-compatible models.<br><small>Carrega modelos no formato JSON do THREE.JSONLoader.</small></div>
  <a-scene >

    <a-entity json-model="src: url(https://cdn.jsdelivr.net/gh/mrdoob/three.js@r71/examples/models/skinned/simple/simple.js)" position="0 1 -3" scale="0.3 0.3 0.3"></a-entity>
    <a-light type="ambient" intensity="0.8"></a-light><a-light type="directional" position="1 3 2"></a-light>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
