<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Controller Cursor - A-Frame</title>
  <meta name="description" content="Cursor component for tracked controls in A-Frame.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-event-set-component.min.js"></script>
  <script src="aframe-controller-cursor-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Controller Cursor</b><br>Cursor component for tracked controls in A-Frame.<br><small>Cursor para controladores 6DOF (requer headset VR).</small></div>
  <a-scene >

    <a-entity id="rightHand" daydream-controls oculus-touch-controls="hand: right" vive-controls="hand: right" windows-motion-controls="hand: right" controller-cursor></a-entity>
    <a-box position="-1.5 1 -3" color="#ef5350" class="clickable" event-set__enter="_event: mouseenter; color: #fff176" event-set__leave="_event: mouseleave; color: #ef5350"></a-box>
    <a-box position="1.5 1 -3" color="#42a5f5" class="clickable"></a-box>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
