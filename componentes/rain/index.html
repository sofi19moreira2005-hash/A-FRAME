<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rain - A-Frame</title>
  <meta name="description" content="A-Frame rain component">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-rain.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Rain</b><br>A-Frame rain component<br><small></small></div>
  <a-scene >

    <a-entity rain="count: 5000; color: #b3e5fc" position="0 0 0"></a-entity>
    <a-box position="0 0.5 -3" color="#795548"></a-box>
    <a-sky color="#37474f"></a-sky><a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
