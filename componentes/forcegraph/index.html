<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Forcegraph - A-Frame</title>
  <meta name="description" content="A 3D Force-Directed Graph component for A-Frame.">
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="aframe-forcegraph-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Forcegraph</b><br>A 3D Force-Directed Graph component for A-Frame.<br><small>Grafo 3D dirigido por forças.</small></div>
  <a-scene >

    <a-entity id="fg" forcegraph position="0 1.6 -3" scale="0.05 0.05 0.05"></a-entity>
    <script>
      document.querySelector('a-scene').addEventListener('loaded',function(){
        document.getElementById('fg').setAttribute('forcegraph',{
          nodes:JSON.stringify([{id:'A',name:'A'},{id:'B',name:'B'},{id:'C',name:'C'},{id:'D',name:'D'},{id:'E',name:'E'},{id:'F',name:'F'}]),
          links:JSON.stringify([{source:'A',target:'B'},{source:'B',target:'C'},{source:'C',target:'A'},{source:'D',target:'A'},{source:'E',target:'D'},{source:'F',target:'E'},{source:'F',target:'B'}]),
          autoColorBy:'id',nodeRelSize:6,lineOpacity:0.6});
      });
    </script>
    <a-sky color="#101020"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 1"></a-entity>
  </a-scene>
</body>
</html>
