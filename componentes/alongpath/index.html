<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Alongpath - A-Frame</title>
  <meta name="description" content="A-Frame Component that allows entities to follow predefined paths">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-curve-component.min.js"></script>
  <script src="aframe-alongpath-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Alongpath</b><br>A-Frame Component that allows entities to follow predefined paths<br><small>Esfera a seguir um caminho (curve).</small></div>
  <a-scene >

    <a-curve id="track">
      <a-curve-point position="-4 1 -6"></a-curve-point>
      <a-curve-point position="-2 3 -8"></a-curve-point>
      <a-curve-point position="2 1 -8"></a-curve-point>
      <a-curve-point position="4 3 -6"></a-curve-point>
      <a-curve-point position="0 1.5 -4"></a-curve-point>
    </a-curve>
    <a-draw-curve curveref="#track" material="shader: line; color: #e91e63;"></a-draw-curve>
    <a-sphere radius="0.4" color="#ff9800" alongpath="curve: #track; dur: 6000; loop: true; rotate: true"></a-sphere>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 2"></a-entity>
  </a-scene>
</body>
</html>
