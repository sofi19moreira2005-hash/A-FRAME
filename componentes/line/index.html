<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Line - A-Frame</title>
  <meta name="description" content="A Line component for A-Frame.">
  <script src="https://aframe.io/releases/0.5.0/aframe.min.js"></script>
  <script src="aframe-line-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Line</b><br>A Line component for A-Frame.<br><small></small></div>
  <a-scene >

    <a-entity line="start: -2 1 -4; end: 2 3 -4; color: #f44336"></a-entity>
    <a-entity line="start: -2 3 -4; end: 2 1 -4; color: #2196f3"></a-entity>
    <a-entity line="start: -2 1 -4; end: -2 3 -4; color: #4caf50"></a-entity>
    <a-entity line="start: 2 1 -4; end: 2 3 -4; color: #ffeb3b"></a-entity>
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane><a-sky color="#9ad1ff"></a-sky><a-entity camera look-controls wasd-controls position="0 1.6 3"></a-entity>
  </a-scene>
</body>
</html>
