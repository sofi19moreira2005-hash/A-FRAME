<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stereo - A-Frame</title>
  <meta name="description" content="Stereoscopic component for A-Frame VR.">
  <script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
  <script src="aframe-stereo-component.min.js"></script>
  <style>
    #info { position: fixed; top: 8px; left: 8px; z-index: 10; max-width: 340px; padding: 8px 12px;
      background: rgba(0,0,0,.65); color: #fff; font: 13px/1.4 sans-serif; border-radius: 6px; pointer-events: none; }
    #info b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="info"><b>Stereo</b><br>Stereoscopic component for A-Frame VR.<br><small>Mostra imagens para cada olho (stereo). Aqui só o olho esquerdo, com a mesma imagem.</small></div>
  <a-scene >

    <a-assets><img id="left" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/city.jpg" crossorigin="anonymous"></a-assets>
    <a-sky src="#left" stereo="eye: left"></a-sky>
    <a-entity camera look-controls stereocam="eye: left" position="0 1.6 0"></a-entity>
    
  </a-scene>
</body>
</html>
